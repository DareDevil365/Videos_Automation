[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-format-editor"
version = "0.2.0"
description = "Local AI-operated video production pipeline and supplied-media Shorts compositor"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
production = ["piper-tts==1.8.0", "google-api-python-client==2.188.0", "google-auth-oauthlib==1.2.4", "requests==2.34.2"]
voices = ["kokoro-onnx==0.6.1"]
sources = ["yt-dlp==2026.10.26", "faster-whisper==1.2.1"]
browser = ["playwright==1.64.1"]

[project.scripts]
shorts-editor = "shorts_editor.cli:main"
yt-pipeline = "yt_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shorts_editor = ["web/*"]
yt_pipeline = ["music_catalog.json", "skills/short-video-writing/SKILL.md", "skills/short-video-writing/references/*.md", "skills/short-video-writing/agents/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

